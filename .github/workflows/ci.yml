name: ci

# ADR-002 (Especificacao FUUDelivery, Parte I): migracoes versionadas rodam
# no CI, nunca no cPanel. Este workflow aplica todas as migracoes do zero,
# reverte tudo e aplica de novo contra um PostgreSQL 16 real com pg_cron, e
# depois roda o smoke test de cada modulo PHP sobre esse banco migrado.

on:
  push:
    paths:
      - "db/**"
      - "api/**"
      - "lib/**"
      - "tests/**"
      - "web/**"
      - "bin/**"
      - "deploy/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "db/**"
      - "api/**"
      - "lib/**"
      - "tests/**"
      - "web/**"
      - "bin/**"
      - "deploy/**"
      - ".github/workflows/ci.yml"

# O token do GITHUB_TOKEN só lê o repositório: o CI não publica, não comenta
# e não escreve nada -- se um passo (ou uma ação de terceiro) for
# comprometido, não tem o que estragar.
permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    # Uma suíte presa (servidor que não sobe, psql esperando) não segura o
    # runner por 6 horas.
    timeout-minutes: 30
    # Como em produção: a API das suítes conecta como app_rw (sem ser dona das
    # tabelas, sujeita à RLS); o semeio dos testes usa o dono (DATABASE_URL).
    env:
      API_DATABASE_URL: postgres://app_rw:app-rw-ci@localhost:5432/fuudelivery
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build imagem Postgres 16 + pg_cron
        run: docker build -t fuudelivery-db ./db

      - name: Subir o banco
        run: |
          docker run -d --name fuudelivery-db \
            -e POSTGRES_DB=fuudelivery \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -p 5432:5432 \
            fuudelivery-db \
            postgres -c shared_preload_libraries=pg_cron -c cron.database_name=fuudelivery -c cron.use_background_workers=on -c max_worker_processes=20

      - name: Esperar o banco aceitar conexao
        run: |
          for i in $(seq 1 30); do
            docker exec fuudelivery-db pg_isready -U postgres -d fuudelivery && break
            sleep 2
          done

      - name: Aplicar as 38 migracoes (up)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fuudelivery
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          bash db/migrate.sh up

      - name: "Reverter tudo e aplicar de novo (down N, up) -- prova de que o round-trip fecha"
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fuudelivery
        run: |
          # N = quantas migrações existem: número fixo aqui quebrava a cada migração nova.
          bash db/migrate.sh down "$(ls db/migrations/*.up.sql | wc -l)"
          bash db/migrate.sh up

      - name: "Senha do role app_rw (a API das suítes conecta com ele)"
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d fuudelivery -c "ALTER ROLE app_rw PASSWORD 'app-rw-ci'"

      - name: Conferir que as tabelas do esquema existem
        env:
          PGPASSWORD: postgres
        run: |
          count=$(psql -h localhost -U postgres -d fuudelivery -tAc \
            "SELECT count(*) FROM pg_tables WHERE schemaname='public'")
          echo "tabelas criadas: $count"
          test "$count" -ge 40

      - name: Instalar PHP 8.4 + pdo_pgsql
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, pgsql, gd, fileinfo, curl

      - name: Lint de sintaxe em todos os arquivos PHP
        run: |
          find lib api bin -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: "Documentação gerada em dia (catálogo da API e mapa do banco)"
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fuudelivery
          JWT_SECRET: ci-test-secret
        run: |
          php bin/generate_api_catalog.php --check
          php bin/generate_api_catalog.php --missing || { echo "rota sem comentário de cabeçalho (acima)"; exit 1; }
          php bin/generate_db_map.php --check

      - name: "Primeiro deploy: admin fundador e política v1 (bin/bootstrap_admin.php) -- roda antes de tudo, no banco vazio"
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fuudelivery
          JWT_SECRET: ci-test-secret
        run: bash tests/smoke_bootstrap_admin.sh

      - name: "Trava de produção: produção falha fechado"
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fuudelivery
        run: bash tests/smoke_production_guard.sh

      - name: "OTP por SMS pela Twilio (contra uma Twilio falsa local; o curl é o de produção)"
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fuudelivery
          JWT_SECRET: ci-test-secret
        run: bash tests/smoke_otp_twilio.sh

      - name: Smoke test -- módulo identity
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fuudelivery
          JWT_SECRET: ci-test-secret
        run: bash tests/smoke_identity.sh

      - name: Smoke test -- módulo catalog+ordering+checkout
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fuudelivery
          JWT_SECRET: ci-test-secret
        run: bash tests/smoke_ordering.sh

      - name: Smoke test -- módulo de descoberta (restaurants/list, search, profile)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fuudelivery
          JWT_SECRET: ci-test-secret
        run: bash tests/smoke_discovery.sh

      - name: Smoke test -- carrinho incremental (Fase 3)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fuudelivery
          JWT_SECRET: ci-test-secret
        run: bash tests/smoke_cart.sh

      - name: Smoke test -- pagamentos (Fase 4 + validação humana do Pix, Fase 7.3)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fuudelivery
          JWT_SECRET: ci-test-secret
          MERCADOPAGO_MODE: fake
