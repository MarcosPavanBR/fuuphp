      - name: "Smoke test -- cadastro de loja pela própria loja e chave Pix no painel (migração 033)"
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fuudelivery
          JWT_SECRET: ci-test-secret
          MERCADOPAGO_MODE: fake
        run: bash tests/smoke_store_signup.sh

      - name: "Smoke test -- cidades atendidas: onboarding e aba Cidades (migração 036)"
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fuudelivery
          JWT_SECRET: ci-test-secret
          MERCADOPAGO_MODE: fake
        run: bash tests/smoke_cities.sh

      - name: "Smoke test -- vitrine da Home: logo, categoria, banners, favoritas, queridinhos (migração 037)"
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fuudelivery
          JWT_SECRET: ci-test-secret
          MERCADOPAGO_MODE: fake
        run: bash tests/smoke_showcase.sh

      - name: "Smoke test -- fuso por cidade: loja de MS no relógio de MS (migração 038)"
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fuudelivery
          JWT_SECRET: ci-test-secret
          MERCADOPAGO_MODE: fake
        run: bash tests/smoke_timezone.sh

      - name: "Smoke test -- entrada ruim em todas as rotas, por todos os papéis: nenhum 5xx"
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fuudelivery
        run: bash tests/smoke_fuzz.sh

      - name: "Smoke test -- fuzz profundo: corpo válido com um campo ruim por vez, em registros que existem: nenhum 5xx"
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fuudelivery
        run: bash tests/smoke_fuzz_deep.sh

      - name: "Smoke test -- autorização: papel errado e dono errado (outro cliente, loja ou entregador) nunca passam"
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fuudelivery
        run: bash tests/smoke_authz.sh

      - name: "Papéis do banco: RLS por loja, livro só de inserção, app_rw sem DDL (go-live)"
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fuudelivery
        run: bash tests/smoke_db_roles.sh

      - name: "Arquivos da VPS (deploy/): scripts sem erro de sintaxe e Nginx aceito pelo nginx -t"
        run: |
          for f in deploy/*.sh deploy/backup/*.sh db/migrate.sh; do bash -n "$f"; done
          # O Nginx só entrega ao PHP ^/api/v1/<área>/<ação>.php$: rota fora
          # desse formato passa no php -S dos testes e dá 404 em produção.
          fora=$(find api -name '*.php' | grep -vE '^api/v1/[a-z_]+/[a-z_]+\.php$' || true)
          [ -z "$fora" ] || { echo "rotas que o Nginx não serve: $fora"; exit 1; }
          sudo apt-get install -y -qq nginx-core > /dev/null
          D="$RUNNER_TEMP/ngx" && mkdir -p "$D"
          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$D/k.key" -out "$D/c.pem" -days 1 -subj /CN=ci 2> /dev/null
          sed -e "s#/etc/ssl/cloudflare/DOMINIO.pem#$D/c.pem#; s#/etc/ssl/cloudflare/DOMINIO.key#$D/k.key#; s#DOMINIO#ci.test#g" \
            deploy/nginx/fuuphp.conf > "$D/site.conf"
          [ -e /proc/net/if_inet6 ] || sed -i '/\[::\]/d' "$D/site.conf"   # runner sem IPv6
          printf 'events{}\nhttp{\ninclude /etc/nginx/mime.types;\ninclude %s/site.conf;\n}\n' "$D" > "$D/nginx.conf"
          cp /etc/nginx/fastcgi_params "$D/"
          sudo nginx -t -c "$D/nginx.conf"

      - name: Instalar Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Build do front-end (web/)
        working-directory: web
        run: |
          npm ci
          npm run build

      # Testes do front sem navegador (node:test, nada instalado a mais): a
      # renovação da sessão, que passou despercebida até a auditoria.
      - name: "Front: testes da sessão (npm test)"
        working-directory: web
        run: npm test

      - name: "Contrato front x back: toda rota que o front chama existe"
        run: php bin/check_front_routes.php

      # Falha grave conhecida numa dependência do front que vai pro usuário
      # (as de desenvolvimento, só de build, ficam de fora) segura o merge.
      - name: "Dependências do front sem vulnerabilidade alta (npm audit)"
        working-directory: web
        run: npm audit --omit=dev --audit-level=high
