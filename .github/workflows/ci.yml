      - name: "Smoke test -- fila de upload offline e push (Fase 7.1 e 7.2 + migração 024)"
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fuudelivery
          JWT_SECRET: ci-test-secret
          MERCADOPAGO_MODE: fake
        run: bash tests/smoke_push.sh

      - name: "Smoke test -- troca de método, gorjeta, Pix único, somente-online, card da loja e mapa (migração 025)"
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fuudelivery
          JWT_SECRET: ci-test-secret
          MERCADOPAGO_MODE: fake
