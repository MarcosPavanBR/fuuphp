      - name: Smoke test -- pedido sem entregador (Fase 15.1 + migração 017)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fuudelivery
          JWT_SECRET: ci-test-secret
          MERCADOPAGO_MODE: fake
        run: bash tests/smoke_dispatch.sh

      - name: Smoke test -- loja operando a si mesma (Fase 11.2 a 11.4 + migração 018)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fuudelivery
          JWT_SECRET: ci-test-secret
          MERCADOPAGO_MODE: fake
        run: bash tests/smoke_store.sh

      - name: Smoke test -- central de ajuda (Fase 14.1)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fuudelivery
          JWT_SECRET: ci-test-secret
          MERCADOPAGO_MODE: fake
        run: bash tests/smoke_help.sh

      - name: Smoke test -- endereço, área e frete no servidor (Fase 14.3 + migração 019)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fuudelivery
          JWT_SECRET: ci-test-secret
          MERCADOPAGO_MODE: fake
        run: bash tests/smoke_address.sh

      - name: Smoke test -- pedido agendado (Fase 14.4 + migração 020)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fuudelivery
          JWT_SECRET: ci-test-secret
          MERCADOPAGO_MODE: fake
        run: bash tests/smoke_schedule.sh

      - name: Smoke test -- entrada de entregador e campanhas (Fase 15.2 e 15.3)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fuudelivery
          JWT_SECRET: ci-test-secret
          MERCADOPAGO_MODE: fake
        run: bash tests/smoke_growth.sh

      - name: "Smoke test -- ocorrencia de entrega e console de reembolso (13.3 e 13.4)"
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fuudelivery
          JWT_SECRET: ci-test-secret
          MERCADOPAGO_MODE: fake
