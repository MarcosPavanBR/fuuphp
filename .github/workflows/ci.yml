name: ci

# ADR-002 (Especificacao FUUDelivery, Parte I): migracoes versionadas rodam
# no CI, nunca no cPanel. Este workflow aplica as trinta e uma migracoes do zero,
# reverte tudo e aplica de novo contra um PostgreSQL 16 real com pg_cron, e
# depois roda o smoke test de cada modulo PHP sobre esse banco migrado.

on:
  push:
    paths:
      - "db/**"
      - "api/**"
      - "lib/**"
      - "tests/**"
      - "web/**"
      - "bin/**"
      - "deploy/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "db/**"
      - "api/**"
      - "lib/**"
      - "tests/**"
      - "web/**"
      - "bin/**"
      - "deploy/**"
      - ".github/workflows/ci.yml"

jobs:
  apply:
    runs-on: ubuntu-latest
    # Como em produção: a API das suítes conecta como app_rw (sem ser dona das
    # tabelas, sujeita à RLS); o semeio dos testes usa o dono (DATABASE_URL).
    env:
      API_DATABASE_URL: postgres://app_rw:app-rw-ci@localhost:5432/fuudelivery
    steps:
      - uses: actions/checkout@v4

      - name: Build imagem Postgres 16 + pg_cron
        run: docker build -t fuudelivery-db ./db

      - name: Subir o banco
        run: |
          docker run -d --name fuudelivery-db \
            -e POSTGRES_DB=fuudelivery \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -p 5432:5432 \
            fuudelivery-db \
            postgres -c shared_preload_libraries=pg_cron -c cron.database_name=fuudelivery

      - name: Esperar o banco aceitar conexao
        run: |
          for i in $(seq 1 30); do
            docker exec fuudelivery-db pg_isready -U postgres -d fuudelivery && break
            sleep 2
          done

      - name: Aplicar as 31 migracoes (up)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fuudelivery
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          bash db/migrate.sh up

      - name: "Reverter tudo e aplicar de novo (down 29, up) -- prova de que o round-trip fecha"
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fuudelivery
        run: |
          bash db/migrate.sh down 31
          bash db/migrate.sh up

      - name: "Senha do role app_rw (a API das suítes conecta com ele)"
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d fuudelivery -c "ALTER ROLE app_rw PASSWORD 'app-rw-ci'"

      - name: Conferir que as tabelas do esquema existem
        env:
          PGPASSWORD: postgres
        run: |
          count=$(psql -h localhost -U postgres -d fuudelivery -tAc \
            "SELECT count(*) FROM pg_tables WHERE schemaname='public'")
          echo "tabelas criadas: $count"
          test "$count" -ge 40

      - name: Instalar PHP 8.4 + pdo_pgsql
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, pgsql, gd, fileinfo, curl

      - name: Lint de sintaxe em todos os arquivos PHP
        run: |
          find lib api bin -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: "Documentação gerada em dia (catálogo da API e mapa do banco)"
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fuudelivery
          JWT_SECRET: ci-test-secret
        run: |
          php bin/generate_api_catalog.php --check
          php bin/generate_api_catalog.php --missing || { echo "rota sem comentário de cabeçalho (acima)"; exit 1; }
          php bin/generate_db_map.php --check

      - name: "Primeiro deploy: admin fundador e política v1 (bin/bootstrap_admin.php) -- roda antes de tudo, no banco vazio"
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fuudelivery
          JWT_SECRET: ci-test-secret
        run: bash tests/smoke_bootstrap_admin.sh

      - name: "Trava de produção: produção falha fechado"
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fuudelivery
        run: bash tests/smoke_production_guard.sh

      - name: Smoke test -- módulo identity
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fuudelivery
          JWT_SECRET: ci-test-secret
        run: bash tests/smoke_identity.sh

      - name: Smoke test -- módulo catalog+ordering+checkout
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fuudelivery
          JWT_SECRET: ci-test-secret
        run: bash tests/smoke_ordering.sh

      - name: Smoke test -- módulo de descoberta (restaurants/list, search, profile)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fuudelivery
          JWT_SECRET: ci-test-secret
        run: bash tests/smoke_discovery.sh

      - name: Smoke test -- carrinho incremental (Fase 3)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fuudelivery
          JWT_SECRET: ci-test-secret
        run: bash tests/smoke_cart.sh

      - name: Smoke test -- pagamentos (Fase 4 + validação humana do Pix, Fase 7.3)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fuudelivery
          JWT_SECRET: ci-test-secret
          MERCADOPAGO_MODE: fake
        run: bash tests/smoke_payments.sh

      - name: "Smoke test -- acompanhamento pós-pedido (Fase 5: timeline, SSE, avaliação)"
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fuudelivery
          JWT_SECRET: ci-test-secret
        run: bash tests/smoke_tracking.sh

      - name: "Smoke test -- conta (Fase 6: endereços e cartões salvos)"
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fuudelivery
          JWT_SECRET: ci-test-secret
          MERCADOPAGO_MODE: fake
        run: bash tests/smoke_account.sh

      - name: "Smoke test -- painel da loja (Fase 7.3 + 11.1: fila de Pix e KDS)"
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fuudelivery
          JWT_SECRET: ci-test-secret
          MERCADOPAGO_MODE: fake
        run: bash tests/smoke_panel.sh

      - name: "Smoke test -- caminho do erro (Fase 13: cancelamento, recusa, reembolso)"
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fuudelivery
          JWT_SECRET: ci-test-secret
          MERCADOPAGO_MODE: fake
        run: bash tests/smoke_cancel.sh

      - name: Smoke test -- entregador e caixa (Fase 8 + 9)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fuudelivery
          JWT_SECRET: ci-test-secret
          MERCADOPAGO_MODE: fake
        run: bash tests/smoke_courier.sh

      - name: Smoke test -- chat do pedido e cupons (Fase 14.2 + migração 008)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fuudelivery
          JWT_SECRET: ci-test-secret
          MERCADOPAGO_MODE: fake
        run: bash tests/smoke_support.sh

      - name: Smoke test -- painel da plataforma (Fase 12 + política da 10.5)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fuudelivery
          JWT_SECRET: ci-test-secret
          MERCADOPAGO_MODE: fake
        run: bash tests/smoke_admin.sh

      - name: "Smoke test -- suporte libera troca de aparelho de loja/entregador"
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fuudelivery
          JWT_SECRET: ci-test-secret
        run: bash tests/smoke_partner_device.sh

      - name: Smoke test -- pedido sem entregador (Fase 15.1 + migração 017)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fuudelivery
          JWT_SECRET: ci-test-secret
          MERCADOPAGO_MODE: fake
        run: bash tests/smoke_dispatch.sh

      - name: Smoke test -- loja operando a si mesma (Fase 11.2 a 11.4 + migração 018)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fuudelivery
          JWT_SECRET: ci-test-secret
          MERCADOPAGO_MODE: fake
        run: bash tests/smoke_store.sh

      - name: Smoke test -- central de ajuda (Fase 14.1)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fuudelivery
          JWT_SECRET: ci-test-secret
          MERCADOPAGO_MODE: fake
        run: bash tests/smoke_help.sh

      - name: Smoke test -- endereço, área e frete no servidor (Fase 14.3 + migração 019)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fuudelivery
          JWT_SECRET: ci-test-secret
          MERCADOPAGO_MODE: fake
        run: bash tests/smoke_address.sh

      - name: Smoke test -- pedido agendado (Fase 14.4 + migração 020)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fuudelivery
          JWT_SECRET: ci-test-secret
          MERCADOPAGO_MODE: fake
        run: bash tests/smoke_schedule.sh

      - name: Smoke test -- entrada de entregador e campanhas (Fase 15.2 e 15.3)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fuudelivery
          JWT_SECRET: ci-test-secret
          MERCADOPAGO_MODE: fake
        run: bash tests/smoke_growth.sh

      - name: "Smoke test -- ocorrencia de entrega e console de reembolso (13.3 e 13.4)"
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fuudelivery
          JWT_SECRET: ci-test-secret
          MERCADOPAGO_MODE: fake
        run: bash tests/smoke_incident.sh

      - name: "Smoke test -- maquininha, conciliacao e netting semanal (9.6, 9.7, 10.4, 10.6)"
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fuudelivery
          JWT_SECRET: ci-test-secret
          MERCADOPAGO_MODE: fake
        run: bash tests/smoke_machine.sh

      - name: "Smoke test -- executor de estornos, CSV contabil, livro do pedido e maquininha propria"
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fuudelivery
          JWT_SECRET: ci-test-secret
          MERCADOPAGO_MODE: fake
        run: bash tests/smoke_money.sh

      - name: "Smoke test -- rodadas do despacho, raio crescente e surge (Fase 15)"
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fuudelivery
          JWT_SECRET: ci-test-secret
          MERCADOPAGO_MODE: fake
        run: bash tests/smoke_rounds.sh

      - name: "Smoke test -- fila de upload offline e push (Fase 7.1 e 7.2 + migração 024)"
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fuudelivery
          JWT_SECRET: ci-test-secret
          MERCADOPAGO_MODE: fake
        run: bash tests/smoke_push.sh

      - name: "Smoke test -- troca de método, gorjeta, Pix único, somente-online, card da loja e mapa (migração 025)"
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fuudelivery
          JWT_SECRET: ci-test-secret
          MERCADOPAGO_MODE: fake
        run: bash tests/smoke_payment_changes.sh

      - name: "Smoke test -- LGPD (exportar/excluir), recibo e repetir pedido (migração 026)"
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fuudelivery
          JWT_SECRET: ci-test-secret
          MERCADOPAGO_MODE: fake
        run: bash tests/smoke_privacy.sh

      - name: "Smoke test -- fidelidade: pontos, trocas e cupom pessoal (Fase 2.3 + migração 029)"
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fuudelivery
          JWT_SECRET: ci-test-secret
          MERCADOPAGO_MODE: fake
        run: bash tests/smoke_loyalty.sh

      - name: "Smoke test -- cupom criado pela própria loja dentro do teto (tela 15.3 + migração 031)"
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fuudelivery
          JWT_SECRET: ci-test-secret
          MERCADOPAGO_MODE: fake
        run: bash tests/smoke_store_coupons.sh

      - name: "Papéis do banco: RLS por loja, livro só de inserção, app_rw sem DDL (go-live)"
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fuudelivery
        run: bash tests/smoke_db_roles.sh

      - name: "Arquivos da VPS (deploy/): scripts sem erro de sintaxe e Nginx aceito pelo nginx -t"
        run: |
          for f in deploy/*.sh deploy/backup/*.sh db/migrate.sh; do bash -n "$f"; done
          sudo apt-get install -y -qq nginx-core > /dev/null
          D="$RUNNER_TEMP/ngx" && mkdir -p "$D"
          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$D/k.key" -out "$D/c.pem" -days 1 -subj /CN=ci 2> /dev/null
          sed -e "s#/etc/ssl/cloudflare/DOMINIO.pem#$D/c.pem#; s#/etc/ssl/cloudflare/DOMINIO.key#$D/k.key#; s#DOMINIO#ci.test#g" \
            deploy/nginx/fuuphp.conf > "$D/site.conf"
          [ -e /proc/net/if_inet6 ] || sed -i '/\[::\]/d' "$D/site.conf"   # runner sem IPv6
          printf 'events{}\nhttp{\ninclude /etc/nginx/mime.types;\ninclude %s/site.conf;\n}\n' "$D" > "$D/nginx.conf"
          cp /etc/nginx/fastcgi_params "$D/"
          sudo nginx -t -c "$D/nginx.conf"

      - name: Instalar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Build do front-end (web/)
        working-directory: web
        run: |
          npm ci
          npm run build
