# Nginx da imagem do Render. Mesmas regras de deploy/nginx/fuuphp.conf (VPS)
# -- só o PWA e as rotas api/v1/<área>/<ação>.php ficam visíveis, mesmos
# cabeçalhos de segurança e CSP --, com três diferenças do contêiner:
#   - HTTP simples na porta __PORT__: o TLS termina no Render (e no
#     Cloudflare, se estiver na frente);
#   - IP real do cliente pelo X-Forwarded-For (abaixo);
#   - log no stdout/stderr (painel do Render > Logs).
# start.sh troca __PORT__ pela variável PORT do Render (padrão 10000).

user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # IP real do cliente. O Render acrescenta ao X-Forwarded-For o IP de
    # quem conectou nele; o balanceador dele fala com o contêiner por rede
    # interna (faixas privadas). Com o Cloudflare na frente, o Cloudflare
    # acrescenta o do cliente antes. Lendo da direita pra esquerda e pulando
    # só endereços confiáveis (rede interna + faixas do Cloudflare), sobra o
    # primeiro que ninguém de confiança acrescentou: o do cliente. Quem
    # forjar um X-Forwarded-For só põe lixo à ESQUERDA do seu IP verdadeiro,
    # que nunca é alcançado.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    # Faixas do Cloudflare: https://www.cloudflare.com/ips/ (as mesmas de
    # deploy/nginx/fuuphp.conf).
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Mesmo limite de volume da VPS pra login/OTP/cadastro, por IP real.
    limit_req_zone $binary_remote_addr zone=fuu_auth:10m rate=30r/m;
    limit_req_status 429;

    # Log sem o token do acompanhamento ao vivo (vai na URL do SSE).
    map $uri $fuu_log_request {
        /api/v1/orders/track.php  "$request_method $uri $server_protocol";
        default                   $request;
    }
    log_format fuu_combined '$remote_addr - [$time_local] "$fuu_log_request" '
                            '$status $body_bytes_sent $request_time "$http_user_agent"';
    access_log /dev/stdout fuu_combined;

    map $uri $fuu_cache_control {
        ~^/assets/  "public, max-age=31536000, immutable";
        ~^/api/v1/(restaurants/(menu_photo|logo)|banners/image)\.php$  "";
        default     "no-cache";
    }

    # O HTTPS é do Render: o PHP decide cookie Secure e afins pelo
    # X-Forwarded-Proto que ele manda.
    map $http_x_forwarded_proto $fuu_https {
        https   on;
        default "";
    }

    server {
        listen __PORT__ default_server;
        server_name _;

        root /srv/fuuphp/web/dist;
        index index.html;
        client_max_body_size 12m;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        # Mesma CSP da VPS -- a justificativa de cada domínio está em
        # deploy/nginx/fuuphp.conf. Mudou lá, muda aqui.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://*.mercadopago.com https://*.mercadolibre.com https://*.mlstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://tile.openstreetmap.org https://*.supabase.co https://*.mercadopago.com https://*.mercadolibre.com https://*.mlstatic.com; connect-src 'self' https://viacep.com.br https://*.mercadopago.com https://*.mercadolibre.com https://*.mlstatic.com; frame-src https://*.mercadopago.com https://*.mercadolibre.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; report-uri /api/v1/system/csp_report.php" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control $fuu_cache_control always;

        location ~ /\. {
            return 404;
        }

        location ^~ /api/ {
            # Acompanhamento ao vivo (SSE): pool próprio do PHP-FPM.
            location = /api/v1/orders/track.php {
                root /srv/fuuphp;
                try_files $uri =404;
                include fastcgi_params;
                fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
                fastcgi_param HTTPS $fuu_https;
                fastcgi_pass unix:/run/php/fuuphp-sse.sock;
                fastcgi_buffering off;
                fastcgi_read_timeout 60s;
            }
            location ~ ^/api/v1/(auth/(otp_request|otp_verify|partner_login)|restaurants/signup|system/csp_report)\.php$ {
                limit_req zone=fuu_auth burst=20 nodelay;
                root /srv/fuuphp;
                try_files $uri =404;
                include fastcgi_params;
                fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
                fastcgi_param HTTPS $fuu_https;
                fastcgi_pass unix:/run/php/fuuphp.sock;
            }
            location ~ ^/api/v1/[a-z_]+/[a-z_]+\.php$ {
                root /srv/fuuphp;
                try_files $uri =404;
                include fastcgi_params;
                fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
                fastcgi_param HTTPS $fuu_https;
                fastcgi_pass unix:/run/php/fuuphp.sock;
            }
            return 404;
        }

        location ^~ /assets/ {
            try_files $uri =404;
        }

        location = /manifest.webmanifest {
            default_type application/manifest+json;
            types { }
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
