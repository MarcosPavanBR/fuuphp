; PHP-FPM da imagem do Render. Mesmo desenho de deploy/php-fpm/fuuphp.conf
; (VPS): um pool pra API, outro pro acompanhamento ao vivo (SSE), cada um no
; seu socket. Diferenças do contêiner:
;   - clear_env = no: os segredos vêm das variáveis de ambiente do Render
;     (não há /etc/fuuphp/fuuphp.env); o pool precisa enxergá-las;
;   - log no stderr do contêiner (aparece em Logs no painel do Render);
;   - processos menores: a instância "Starter" do Render tem 512 MB.
;     Suba max_children junto com o plano (Standard = 2 GB: API 20, SSE 30).

[global]
error_log = /proc/self/fd/2
log_limit = 8192
daemonize = no

[fuuphp]
user = www-data
group = www-data
listen = /run/php/fuuphp.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 4
pm.max_requests = 1000
request_terminate_timeout = 60s

clear_env = no
catch_workers_output = yes
decorate_workers_output = no

php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[memory_limit] = 256M
; O PHP só abre arquivo do projeto, do disco persistente e do tmp.
php_admin_value[open_basedir] = /srv/fuuphp/:/var/fuuphp/:/tmp/:/dev/null

; Acompanhamento ao vivo: cada cliente olhando o pedido segura um processo
; por até ~25 s (esperando o LISTEN do banco). Pool próprio: lotar aqui só
; atrasa o acompanhamento, não para login nem pagamento.
[fuuphp-sse]
user = www-data
group = www-data
listen = /run/php/fuuphp-sse.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 12
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 1000
request_terminate_timeout = 40s

clear_env = no
catch_workers_output = yes
decorate_workers_output = no

php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[memory_limit] = 64M
php_admin_value[open_basedir] = /srv/fuuphp/:/var/fuuphp/:/tmp/:/dev/null
