; PHP da imagem do Render, por cima do php.ini-production oficial.
; Igual à VPS (docs/GO_LIVE.md): não anunciar a versão, erro só no log.
expose_php = Off
display_errors = Off
log_errors = On
; Horário: o PHP já fixa America/Sao_Paulo no bootstrap; aqui só pra não
; haver aviso antes dele.
date.timezone = America/Sao_Paulo

; Uploads: o maior é comprovante/foto de ocorrência (10 MB).
upload_max_filesize = 12M
post_max_size = 13M

; O código da imagem não muda depois do build: o opcache não precisa
; conferir o arquivo a cada requisição.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
