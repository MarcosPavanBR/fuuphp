; Pool do PHP-FPM do FUUdelivery (go-live, passo 7).
;
; Instalar: copie para /etc/php/8.4/fpm/pool.d/fuuphp.conf e rode
; `systemctl reload php8.4-fpm`. O Nginx fala com o socket abaixo
; (deploy/nginx/fuuphp.conf).
;
; Usuário próprio (fuuphp), sem shell: é o único que lê o .env e escreve em
; /var/fuuphp/storage. O Nginx (www-data) não lê nenhum dos dois.

[fuuphp]
user = fuuphp
group = fuuphp

listen = /run/php/fuuphp.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; O acompanhamento ao vivo (SSE) tem pool próprio, [fuuphp-sse] no fim
; deste arquivo: este aqui atende só requisição curta. 2 GB de RAM aguentam
; os dois pools com folga pro PostgreSQL; ajuste com o tamanho da VPS.
pm = dynamic
pm.max_children = 30
pm.start_servers = 6
pm.min_spare_servers = 4
pm.max_spare_servers = 10
pm.max_requests = 1000

request_terminate_timeout = 60s

; Os segredos ficam num arquivo só, fora do projeto e fora da raiz servida
; (dono fuuphp, permissão 600). lib/bootstrap.php lê o caminho daqui.
env[FUU_ENV_FILE] = /etc/fuuphp/fuuphp.env
clear_env = yes

; Erro vai pro log, nunca pra resposta.
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/fuuphp/php-error.log

; Uploads: o maior é comprovante/foto de ocorrência (10 MB).
php_admin_value[upload_max_filesize] = 12M
php_admin_value[post_max_size] = 13M
php_admin_value[memory_limit] = 256M

; O PHP só abre arquivo do projeto, das pastas de arquivo, do .env e do tmp.
php_admin_value[open_basedir] = /srv/fuuphp/:/var/fuuphp/:/etc/fuuphp/:/tmp/

; expose_php só vale no php.ini: em /etc/php/8.4/fpm/php.ini deixe
; expose_php = Off (não anunciar a versão do PHP no cabeçalho).

; ── Acompanhamento ao vivo (orders/track.php, SSE) ─────────────────────
; Pool separado (auditoria DevSecOps de 27/09/2026): cada cliente olhando o
; pedido segura um processo por até ~25 s. No pool da API, uns 40 clientes
; olhando o pedido paravam login, pagamento e painel juntos. Aqui, lotar só
; atrasa o acompanhamento (o app reconecta sozinho). O Nginx manda só o
; track.php pra este socket. Cada pessoa usa no máximo 3 conexões (trava no
; próprio track.php): a quarta aba recebe o estado e volta em 15 s.
; Processo SSE é leve (espera o LISTEN do PostgreSQL), então cabem mais.
[fuuphp-sse]
user = fuuphp
group = fuuphp

listen = /run/php/fuuphp-sse.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 40
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 1000

request_terminate_timeout = 40s

env[FUU_ENV_FILE] = /etc/fuuphp/fuuphp.env
clear_env = yes

php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/fuuphp/php-error.log
php_admin_value[memory_limit] = 64M
php_admin_value[open_basedir] = /srv/fuuphp/:/var/fuuphp/:/etc/fuuphp/:/tmp/
