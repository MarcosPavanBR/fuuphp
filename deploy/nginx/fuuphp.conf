# Nginx do FUUdelivery na VPS (go-live, passo 7).
#
# Instalar: copie para /etc/nginx/sites-available/fuuphp, troque DOMINIO,
# ligue com um symlink em sites-enabled e rode `nginx -t && systemctl reload nginx`.
#
# O que este arquivo garante:
#   - Só duas coisas ficam visíveis: o PWA já compilado (web/dist) e as rotas
#     da API (api/v1/<área>/<ação>.php). .env, lib/, bin/, db/, tests/,
#     storage/ e o resto do projeto NÃO têm como ser servidos -- a raiz do
#     site é web/dist, não a raiz do projeto.
#   - O tráfego chega pelo Cloudflare (proxy laranja, SSL "Full (strict)" com
#     o certificado de origem do Cloudflare). O IP real do cliente vem de
#     CF-Connecting-IP, mas SÓ quando a conexão vem de uma faixa do
#     Cloudflare; ninguém forja o IP gravado na prova de consentimento.
#   - Comprovantes e documentos de entregador moram fora do projeto
#     (/var/fuuphp/storage) e só saem pelas rotas autenticadas da API.

# Faixas do Cloudflare: https://www.cloudflare.com/ips/ -- confira ao instalar
# e quando o Cloudflare anunciar mudança.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# Cache por caminho num lugar só: add_header dentro de location faria o Nginx
# esquecer os cabeçalhos de segurança do server (herança do add_header).
# Arquivos com hash no nome: cache longo. Todo o resto (HTML, sw.js,
# manifest, API): revalidar sempre, senão a atualização do PWA não chega.
map $uri $fuu_cache_control {
    ~^/assets/  "public, max-age=31536000, immutable";
    # Imagens da vitrine: a rota PHP já manda "public, max-age=1 ano,
    # immutable" (URL por hash do conteúdo). Valor vazio = o Nginx não põe
    # outro Cache-Control por cima.
    ~^/api/v1/(restaurants/(menu_photo|logo)|banners/image)\.php$  "";
    default     "no-cache";
}

server {
    listen 80;
    listen [::]:80;
    server_name DOMINIO;
    return 301 https://$host$request_uri;
}

server {
    # "listen ... http2" funciona do Nginx 1.22 (Debian 12) ao 1.24 (Ubuntu
    # 24.04); no 1.25.1+ vira aviso e dá pra trocar por "http2 on;".
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name DOMINIO;

    # Certificado de origem do Cloudflare (SSL/TLS > Origin Server).
    ssl_certificate     /etc/ssl/cloudflare/DOMINIO.pem;
    ssl_certificate_key /etc/ssl/cloudflare/DOMINIO.key;

    root /srv/fuuphp/current/web/dist;
    index index.html;

    # Maior upload da API: comprovante/foto de ocorrência (10 MB) + folga do multipart.
    client_max_body_size 12m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control $fuu_cache_control always;

    # Nada que começa com ponto (.env, .git...), em lugar nenhum.
    location ~ /\. {
        return 404;
    }

    # ---- API ------------------------------------------------------------
    # Só arquivos no formato api/v1/<área>/<ação>.php; qualquer outro caminho
    # em /api/ é 404 sem nem chegar no PHP.
    location ^~ /api/ {
        location ~ ^/api/v1/[a-z_]+/[a-z_]+\.php$ {
            root /srv/fuuphp/current;
            try_files $uri =404;

            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_pass unix:/run/php/fuuphp.sock;

            # Acompanhamento ao vivo (orders/track.php, SSE): a rota manda
            # X-Accel-Buffering: no e fecha sozinha em ~25 s; o front reconecta.
            fastcgi_read_timeout 60s;
        }
        return 404;
    }

    # ---- PWA --------------------------------------------------------------
    location ^~ /assets/ {
        try_files $uri =404;
    }

    # O mime.types padrão não conhece .webmanifest (sairia text/plain).
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        types { }
        try_files $uri =404;
    }

    # Os quatro apps: / (cliente), /painel.html, /entregador.html, /admin.html.
    # O cliente é SPA: rota desconhecida cai no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/fuuphp.access.log;
    error_log  /var/log/nginx/fuuphp.error.log warn;
}
