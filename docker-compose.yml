services:
  db:
    build: ./db
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_cron
      - -c
      - cron.database_name=fuudelivery
      - -c
      - cron.use_background_workers=on
      - -c
      - max_worker_processes=20
    environment:
      POSTGRES_DB: fuudelivery
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - fuudelivery_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fuudelivery"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: php:8.4-cli
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/fuudelivery
      JWT_SECRET: dev-secret-not-for-prod
      APP_ENV: development
    depends_on:
      db:
        condition: service_healthy
    # a imagem oficial não vem com pdo_pgsql; instala e sobe o servidor
    # embutido do PHP num único comando, sem Dockerfile próprio pra dev.
    entrypoint: ["sh", "-c", "docker-php-ext-install pdo_pgsql pgsql >/dev/null && php -S 0.0.0.0:8080 -t /app"]

volumes:
  fuudelivery_pgdata:
