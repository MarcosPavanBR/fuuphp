services:
  db:
    build: ./db
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_cron
      - -c
      - cron.database_name=fuudelivery
    environment:
      POSTGRES_DB: fuudelivery
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - fuudelivery_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fuudelivery"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fuudelivery_pgdata:
